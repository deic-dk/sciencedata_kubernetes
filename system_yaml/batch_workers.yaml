        - name: USERNAME
          value: 'gridfactory'
        - name: SD_UID
          value: 'batch'
        - name: HOME_SERVER        # where the worker fetches batch's key/cert (getkey/getcert)
          value: '10.2.0.13'
        - name: PUBLIC_HOME_SERVER
          value: 'sciencedata.dk'
        - name: HOME_SERVER_PROTOCOL
          value: 'https'
        - name: PEERS_IMAGE
          value: 'sciencedata/batch_server'
        - name: PEERS  # the system batch server (Service 'batch' - will be replaced with current value by the workers). We set the value to a non-numerical, so configure_worker_node.sh does not add a (stale) entry to /etc/hosts and the correct entry from dns is used to fetch the server certificate
          value: 'batch:batch'
        - name: MY_VOS
          value: 'https://batch/vos/default.txt'
        - name: KEY_PASSWORD
          value: 'grid'
        - name: UNENCRYPTED_KEY
          value: 'true'
        resources:
