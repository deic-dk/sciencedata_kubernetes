        types: small-medium-large
    spec:
      # peon141/162 (Opteron) lack AVX: PyTorch/whisper and much other job software fail there.
      nodeSelector:
        avx-present: "yes"
      containers:
      - name: batch-worker-whisper
        image: sciencedata/batch_worker_whisper
